;reference_gff   = /path/to/Eru.fixed.gff3
;reference_cds   = /path/to/Eru.cds.fa
;
;[chromosomes]
;mode       = group_file
;group_file = ./groups.example.tsv
;subgenomes = A,B,C,D,E,F,G,H,I,J,K,L
;
;[reference]
;prefix = Chr
;group_ref_map = Group_01:Chr01, Group_02:Chr02, Group_03:Chr03, Group_04:Chr04, Group_05:Chr05, Group_06:Chr06, Group_07:Chr07, Group_08:Chr08, Group_09:Chr09, Group_10:Chr10
;
;[projection]
;cscore  = 0.70
;threads = 16
;
