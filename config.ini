; =============================================================================
;  PolyAllele v4 -- configuration
;
;  Everything the pipeline needs is specified here: inputs, chromosome groups,
;  algorithm parameters, outputs and how to run.  Paths may be absolute, or
;  relative to the directory that holds THIS file.
;
;  Run with:      bash run_polyallele.sh
;  Or directly:   python bin/polyallele.py --config config.ini all
;
;  Values shown are illustrative defaults.  An example that was actually run
;  (sugarcane ROC22 against Erianthus rufipilus) is in the [example] section
;  at the bottom, commented out.
;
; -----------------------------------------------------------------------------
;  TWO MEASURED PROFILES.  The defaults below are profile B.
;
;  Both profiles were run end to end on sugarcane ROC22 vs Erianthus rufipilus
;  and validated against (i) a curated 12-locus WOX family and (ii) an
;  independently built allele table (AlleleFinder, in the public XTT22 release).
;
;                                   A: conservative      B: default
;    cross-group merges                      0                 0
;    curated-WOX over-merge                  0                 0
;    1:1 rate                             ~84%             85.03%
;    inflation                          ~1.19x            1.1961x
;    of "single copy" genes, the share
;      whose allele exists but was not
;      grouped with them                  40.0%             17.4%
;    agreement with the independent
;      method, our grouping reproduced   81.44%            78.45%
;    our merges it disputes that are
;      PROVABLY impossible (two genes on
;      one chromosome, or two homology
;      groups)                            6.54%             9.92%
;
;  Profile A is reproduced by setting:
;      interpolation.keep_same_chromosome_collisions = false
;      interpolation.distribute_surplus              = false
;      repair.enabled                                = false
;  which leaves the same_locus fix and nothing else.
;
;  READ THIS BEFORE CHOOSING.  The two metrics on which B is worse are both
;  UPPER BOUNDS, not measurements: the criterion calls ANY same-chromosome
;  grouping an over-merge, while a real tandem or segmental duplication on one
;  chromosome is exactly that and is common in this genome.  And the
;  "agreement" benchmark is not a gold standard -- the reference method is
;  itself 33.9% provably-impossible by the same criterion, mostly by merging
;  across homology groups, which profile B never does.
;
;  If your downstream analysis is sensitive to same-chromosome grouping, run
;  profile A.  If it is sensitive to genes being left out of the table, run B.
;  Report which one you used.
; -----------------------------------------------------------------------------
; =============================================================================


; -----------------------------------------------------------------------------
;  1. INPUTS
; -----------------------------------------------------------------------------
[input]
; --- the polyploid to be analysed -------------------------------------------
; Option A: supply the whole-genome GFF3 + FASTA and let the pipeline extract
;           per-chromosome CDS with gffread.
; Option B: supply a directory of PRE-EXTRACTED per-chromosome files
;           (<chrom>.cds, <chrom>.bed [, <chrom>.pep]).  Faster and more
;           reproducible; the directory is searched recursively.
;           If target_prep_dir is set, target_gff / target_fasta are ignored.
target_prep_dir =
target_gff       =
target_fasta     =

; --- reusing anchors --------------------------------------------------------
; Optional.  A directory holding already-computed JCVI .anchors files
; (searched recursively).  When set, the `project` stage links
; <chromosome>.<reference>.anchors from here instead of recomputing the
; pairwise alignments -- useful when you have run the projection before, or
; when another pipeline already produced them.
anchors_dir =

; --- the reference ----------------------------------------------------------
; A well-assembled DIPLOID relative.  It defines the ancestral-locus frame:
; every row of the output matrix is one of its genes.
; reference_pep is optional; when empty the pipeline translates reference_cds.
reference_gff =
reference_cds =
reference_pep =

; --- gene IDs ---------------------------------------------------------------
; A gene ID must match between the target BED, the target CDS/PEP and the JCVI
; anchors, or nothing is anchored at all -- and the failure shows up much later
; as an empty result rather than as an error.  Annotation pipelines disagree
; about the exact spelling: a trailing -P / -T, a .1 transcript number, a quoted
; GFF attribute, a CRLF left by a Windows round trip.
;
; This regular expression is applied to EVERY gene ID the pipeline reads, from
; every file, so that one gene written two ways still matches.  The default
; removes a single trailing `-<letter>`, which is the commonest variant; set it
; to empty to switch normalisation off and match IDs exactly.
;
;   gene_id_strip = -[A-Za-z]$        strip a trailing -P / -T / -A
;   gene_id_strip = \.[0-9]+$         strip a trailing .1 / .2
;   gene_id_strip =                   no normalisation
gene_id_strip = -[A-Za-z]$


; -----------------------------------------------------------------------------
;  2. CHROMOSOME GROUPS
;     A polyploid genome is described as a set of homology groups, each holding
;     the homoeologous chromosomes that descend from one ancestral chromosome.
; -----------------------------------------------------------------------------
[chromosomes]
; mode = standard   : chromosomes named <prefix><group><suffix>,
;                     e.g. Chr1A, Chr1B ... Chr10L
; mode = group_file : groups listed explicitly in a TSV, one group per line:
;                       GroupName <TAB> Chromosome1 <TAB> Chromosome2 ...
;                     Use this whenever the naming is irregular.
mode = standard

group_file =

; --- standard mode only ------------------------------------------------------
prefix      = Chr
group_start = 1
group_end   = 10
; the subgenome suffixes, in the order they should appear as columns
subgenomes  = A,B,C,D,E,F,G,H,I,J,K,L


; -----------------------------------------------------------------------------
;  3. REFERENCE FRAME
; -----------------------------------------------------------------------------
[reference]
; Leading string of the reference chromosome names (used for auto-mapping).
prefix = Chr

; Which reference chromosome defines the frame for each homology group.
; Comma-separated  group:referenceChromosome  pairs.  Leave EMPTY to let the
; pipeline match by number: group 1 -> Chr01, group 2 -> Chr02, ...
; Fill it in explicitly whenever the correspondence is not by number.
; Example:  Group_01:Chr01, Group_02:Chr03, Group_03:Chr05
group_ref_map =


; -----------------------------------------------------------------------------
;  4. COLLINEAR PROJECTION  (tier 1: the positional skeleton)
; -----------------------------------------------------------------------------
[projection]
; JCVI MCScan C-score.  Lower = more anchors = more coverage but noisier.
; 0.7 is a reasonable default for a congeneric reference; 0.9-0.99 for a
; distant one.
cscore = 0.70
; CPU threads for LAST / the best-hit screen
threads = 8
; Also project every target chromosome against EVERY reference chromosome and
; report the identity-criterion comparison.  Costs ~(n_groups) times the run
; time.  Purely diagnostic -- it does not change the output matrix.
audit = false


; -----------------------------------------------------------------------------
;  4b. THE BEST-HIT SCREEN
;     Three stages ask the same question -- for each of these query proteins,
;     what is its best hit among those candidates, and at what identity and
;     alignment length?  The answer feeds coarse thresholds (>= 70-90% over
;     >= 60-80 aa), so the aligner only has to rank candidates correctly.
; -----------------------------------------------------------------------------
[alignment]
evalue = 1e-5

; Hits kept per query.  The three screens do not want the same thing, so this is
; resolved per stage, with `max_target_seqs_<stage>` winning when present:
;   max_target_seqs_interp  / _refine : the screen picks the best hit inside a
;       small candidate window, so a narrow net is enough.  20 is the value the
;       whole pipeline was validated at -- do not change it casually.
;   max_target_seqs_repair : the screen searches the ENTIRE placed set for an
;       allelic partner, so a wider net is needed (50).
max_target_seqs        = 20
max_target_seqs_repair = 50

; Shard the query set across this many aligner processes running side by side.
; blastp scales poorly with thread count, so on a node with many cores several
; narrow shards finish sooner than one wide process.  The aligner, its parameters
; and therefore the hits are unchanged -- only the wall time is.  Each shard gets
; [projection] threads / shards threads.  Set to 1 for a single process.
; Rule of thumb: shards ~ 4, with threads set to the cores you were given.
shards = 1


; -----------------------------------------------------------------------------
;  5. INTERPOLATION  (tier 2: filling the gaps between anchors)
; -----------------------------------------------------------------------------
[interpolation]
; Genes lying between two anchors are placed by order-preserving interpolation.
; Intervals wider than this many reference loci are left unplaced rather than
; guessed.  Raise it for closely related references, lower it for distant ones.
max_interval = 50

; When BOTH flanking anchors sit on the SAME reference locus, the genes between
; them are bracketed evidence that they are additional copies AT that locus
; (a tandem or segmental array).  They are placed there and appear in
; Extra_Copies.  This caps how many may be absorbed by one such cell; any surplus
; is pushed to its own interval slot instead of inflating the cell.
max_copies_at_anchored_locus = 50

; When two genes on the SAME chromosome project to the same reference locus they
; MIGHT be genuine copies at that locus -- or the projection might be off, since
; intervals in reference-locus space can overlap when it is non-monotonic.
;
; The two are told apart by GENE ORDER: a real tandem array puts neighbours
; together.  A collision is therefore absorbed into the cell only when the gene
; is within `tandem_gene_window` gene models of one already there; anything
; further away gets its own slot.
;
; Why this bound exists: absorbing EVERY collision (window = infinite) looked
; better on the curated family benchmark but made things worse overall -- the
; third-party comparison showed the provably-bad merge rate doubling
; (6.54% -> 15.12%) and agreement with an independent method falling from 81.4%
; to 66.5%.  Set `keep_same_chromosome_collisions = false` to disable absorbing
; entirely (the pre-v4.2 behaviour).
keep_same_chromosome_collisions = true
tandem_gene_window = 5


; -----------------------------------------------------------------------------
;  5b. LOCUS REPAIR
;     A gene the projection could not put at a reference locus -- it sits in a
;     synthetic slot, or fell into an interval too wide to interpolate -- may
;     still have an allele that WAS placed: its homoeolog on another chromosome
;     of the same homology group.  Moving it there is allowed only when position
;     and similarity agree.
; -----------------------------------------------------------------------------
[repair]
enabled = true

; The partner must sit at a REAL reference locus (not a synthetic slot), in the
; SAME homology group but on a DIFFERENT chromosome.  Genes on homoeologous
; chromosomes are allelic by default; a same-chromosome partner would be a
; paralog, and that case is refused outright.
; BLASTP stringency for the move:
min_identity  = 90
min_alignment = 80

; Positional authority: the partner's locus must lie inside the interval the
; gene was bracketed by, allowing this many reference loci of slack.  With
; window = 1 a gene bracketed by adjacent reference loci i and i+1 may move to
; i-1 .. i+2 -- i.e. onto one of its own anchors or one locus beyond.
window = 1


; -----------------------------------------------------------------------------
;  6. REFINEMENT  (tier 3)
; -----------------------------------------------------------------------------
[refinement]
; enabled = true runs the refinement stage.
enabled = true

; (a) similarity_first: for genes placed by PROPORTIONAL spacing inside an
;     interval (order alone cannot decide which reference locus they belong to),
;     BLASTP against the reference and use the best hit *inside the interval*.
similarity_first = true

; (b) satellite rescue: a gene sitting alone in a small row is merged into a
;     nearby rich row -- but only if BOTH hold:
;        position : the rich row is within <window> reference loci on the SAME
;                   reference chromosome
;        homology : BLASTP identity >= min_identity over >= min_alignment aa
;     This is the step that repairs over-splitting without reintroducing the
;     over-merging that pure similarity clustering suffers from.
rich_min       = 4      ; a row needs at least this many genes to absorb others
sparse_max     = 2      ; only genes in rows this small are candidates to move
window         = 10     ; max distance in reference loci
min_identity   = 70     ; percent identity
min_alignment  = 60     ; alignment length in amino acids


; -----------------------------------------------------------------------------
;  8. MERGE -- bring a lone gene home
; -----------------------------------------------------------------------------
; A row holding exactly ONE gene can mean two very different things, and the two
; are easy to confuse:
;
;     * the gene really is alone -- nothing else in the genome is its allele; or
;     * its homoeologs WERE placed, but in other rows, because the anchors are
;       dense on one chromosome and sparse on the other, so one ancestral locus
;       got written at two different slots.
;
; Only the first deserves to be read as "single copy", so this stage moves the
; second kind of gene into the row that already holds its partner.  It is allowed
; to do so only when ALL of these hold:
;
;     position  the gene is alone in its row;
;     partner   its best non-self BLASTP hit (>= min_identity over >=
;               min_alignment aa) is a gene that IS in the table;
;     homology  same homology group but a DIFFERENT chromosome -- a partner on
;               the gene's own chromosome is a paralog, not an allele, and is
;               refused outright;
;     room      the destination cell -- (partner's locus, the gene's OWN
;               chromosome) -- is EMPTY.  Filling an occupied cell would put two
;               genes of one chromosome into one cell, which is the over-merge
;               this pipeline exists to avoid.
;
; Set enabled = false to reproduce the previous behaviour exactly.
[merge]
enabled        = true
min_identity   = 90     ; percent identity; 90 matches the rest of the pipeline
min_alignment  = 80     ; alignment length in amino acids


; -----------------------------------------------------------------------------
;  9. COPY CLASS -- the two tables that sit NEXT TO the matrix
; -----------------------------------------------------------------------------
; The matrix answers "which ancestral locus does this gene belong to".  It cannot
; answer "is this gene single copy in the genome" -- those are different
; questions, and a row with one gene is a statement about the ROW, not the GENE.
;
; These tables are built by bin/extra_tables.py, from the matrix plus ONE
; genome-wide all-vs-all screen.  They only read what the pipeline wrote, so a
; problem here can never damage the matrix, and they can be re-run on their own
; after changing a threshold.
;
;   <prefix>.unplaced_matrix.tsv    genes that entered no row, arranged as a
;                                   matrix too: rows are loci, columns are
;                                   chromosomes
;   <prefix>.locus2gene.tsv         LocusID <TAB> GeneID -- an ancestral locus
;   <prefix>.competition2gene.tsv   ClusterID <TAB> GeneID -- for QUANTIFICATION
;   <prefix>.gene2copyclass.tsv     every gene: both groupings plus the labels
;
; TWO GROUPINGS, because one cannot serve both purposes.  The matrix's rows are
; ancestral loci; the quantifier reads the rows of a cluster file and treats a
; one-gene row as single copy, so two genes that are really brothers but sit in
; separate one-gene rows will NOT compete and their expression comes out
; inflated.  Merging loci until brothers share a row fixes that but destroys the
; locus structure -- in a genome where 46% of genes have a 100%-identical
; relative, chaining took the largest group to 30,656 genes.  So both are written:
; loci for position, competition clusters for quantification.
;
; `competition_identity` is the identity above which two genes fight over one
; read, and it is NOT the same question as "are these duplicates".  Measured on
; the reference dataset:
;
;     T      components   genes alone   largest cluster
;     90%        51,327        16,454            20,414
;     95%        75,447        33,554             4,486
;     98%       116,689        66,452               204
;     99%       158,725       102,337               100
;
; Lower means more genes compete (less inflation, more over-grouping); higher
; means fewer compete (tighter groups, more inflation).  Pick it to match what
; your quantifier can actually tell apart: a k-mer based pseudo-aligner
; (Salmon, kallisto) treats genes sharing 31-mers as ambiguous, so it belongs at
; the low end; an aligner with a strict mismatch limit belongs higher.
;
; `allvall` must point at a genome-wide all-vs-all screen in BLAST outfmt 6 with
; at least  qseqid sseqid pident length  as the first four columns.
;
; USE BLASTP.  This was measured, not assumed: with DIAMOND --sensitive, the
; single_copy calls were checked against BLASTP on the same data and 24.58% of
; them were WRONG -- the gene did have a >=90% relative.  `--sensitive` is not
; sensitive enough for this question, and the whole point of the column is to say
; "nothing else in this genome is like this gene".  DIAMOND --ultra-sensitive may
; be adequate but has not been measured here.
;
;     cat <genome>/*.pep > all.pep
;     makeblastdb -in all.pep -dbtype prot -out alldb
;     blastp -query all.pep -db alldb -outfmt "6 qseqid sseqid pident length" \
;            -evalue 1e-5 -max_target_seqs 100 -num_threads 48 > allvall.tsv
;
; That is hours on one node.  A cheaper route that is exact for the question
; actually being asked: genes that are alone WITHIN their homology group can only
; be changed by a cross-group relative, so screen only those against the whole
; proteome.  On the reference dataset that was 42,659 of 336,211 genes, and it
; cut the run from hours to about forty minutes.
[copyclass]
enabled        = true
; Empty = skip the extra tables (the matrix is still produced).
allvall        =
min_identity   = 90     ; attach an unplaced gene to a locus at this identity
competition_identity = 95   ; above this, two genes fight over the same read
min_alignment  = 60     ; alignment length in amino acids


; -----------------------------------------------------------------------------
;  10. OUTPUT
; -----------------------------------------------------------------------------
[output]
; Scratch space (sequences, JCVI working dirs, BLAST databases).
work_dir = ./polyallele_work
; Final tables.
out_dir  = ./polyallele_out
; Prefix for every output file.
prefix   = polyallele
; Write rows whose locus is a reference-bracketed interval slot (i.e. genes with
; no reference orthologue) to their own file as well as to the main matrix.
; Recommended: they carry no Ref_Gene and are usually singletons.
split_synthetic = true

; --- copy identity ----------------------------------------------------------
; Every extra copy in a cell is labelled by its physical distance from that
; cell's representative, so that a paralog is reported as the kind of paralog
; it actually is:
;     tandem_copy     <= tandem_kb      (a tandem array)
;     proximal_copy   <= proximal_kb    (a local / segmental duplication)
;     dispersed_copy  >  proximal_kb    (a dispersed duplication)
; The label appears as `CopyClass` in the long table and as `Extra_Classes`
; in the wide matrix.
tandem_kb   = 10
proximal_kb = 1000


; -----------------------------------------------------------------------------
;  8. RUNTIME  (how run_polyallele.sh should launch the work)
; -----------------------------------------------------------------------------
[runtime]
; Conda environment to activate.  Leave empty to use whatever python is on PATH.
conda_env = polyallele

; Which best-hit aligner to use for the screening stages.
;
;   blastp  -- NCBI blastp, the reference implementation.  DEFAULT, because it
;              is the one whose behaviour has been validated end to end.
;   diamond -- roughly two orders of magnitude faster, and tempting: on the
;              sugarcane dataset it turns a ~2 h refinement stage into ~2 min.
;              BUT it is not interchangeable.  Measured on 2,000 queries against
;              the same candidate set:
;                  best partner identical to blastp : 58.65%
;                  pairs passing id>=70 / len>=60  : Jaccard 86.16%
;                  pairs passing id>=90 / len>=80  : Jaccard 85.72%
;              In a polyploid many homoeologs are near-identical, so the top
;              hits are near-ties and the two aligners break them differently.
;              Use diamond to explore; do not publish a matrix built with it
;              without showing that the conclusion survives the substitution.
;
; If the chosen aligner is missing the pipeline falls back to the other.
aligner = blastp

; scheduler = none  -> run directly in the current shell
;                          (a laptop, or a compute node you are already on)
;             pbs   -> write a PBS job script into work_dir and qsub it
;             slurm -> write a SLURM job script into work_dir and sbatch it
scheduler = none

pbs_queue    = comput
pbs_ppn      = 16
pbs_walltime = 12:00:00
job_name     = polyallele


; =============================================================================
;  EXAMPLE -- sugarcane ROC22 (XTT22) against Erianthus rufipilus
;  Uncomment and adapt.  This is the configuration that was actually validated.
; =============================================================================
;[input]
