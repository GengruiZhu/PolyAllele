name: polyallele
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.9
  - numpy
  - pandas
  - biopython
  - networkx
  - openpyxl          # only used by optional gene-family calibration tables
  # --- external tools -------------------------------------------------------
  - last              # JCVI uses LAST for the pairwise alignment step
  - blast             # makeblastdb / blastp, for the refinement stage
  - jcvi              # MCScan implementation (jcvi.compara.catalog)
  - gffread           # only needed when input.target_prep_dir is not supplied
  # --- optional -------------------------------------------------------------
  # - orthofinder      # only if you want to build Orthogroups.tsv yourself
  - r-base            # only if you want to run R-based downstream figures
